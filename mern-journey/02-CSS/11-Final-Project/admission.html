<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Information Portal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Admission Form</h1>
      <nav>
        <a href="index.html">Home</a> | <a href="courses.html">Courses</a> |
        <a href="admission.html">Admission</a>
      </nav>
    </header>
    <form action="">
      <label for="student-name">Student Name</label>
      <input type="text" name="student-name" id="student-name" />
      <label for="email">Email</label>
      <input type="email" name="email" id="email" />
      <label for="phone">Phone</label>
      <input type="tel" name="phone" id="phone" />
      <label for="password">Password</label>
      <input type="password" name="password" id="password" />
      <label for="date">Date of Birth</label>
      <input type="date" name="date" id="date" />
      <label>Gender:</label>

      <div class="option">
        <input type="radio" id="male" name="gender" value="male" />
        <label for="male">Male</label>
      </div>

      <div class="option">
        <input type="radio" id="female" name="gender" value="female" />
        <label for="female">Female</label>
      </div>

      <div class="option">
        <input type="radio" id="other" name="gender" value="other" />
        <label for="other">Other</label>
      </div>

      <label for="course">Course Selection</label>
      <select name="course" id="course">
        <option value="">Select a Course</option>
        <option value="bsc-it">B.Sc IT</option>
        <option value="bca">BCA</option>
        <option value="mca">MCA</option>
        <option value="full-stack-development">Full Stack Development</option>
      </select>
      <label>Skills:</label>

      <div class="option">
        <input type="checkbox" id="html" name="skills" value="html" />
        <label for="html">HTML</label>
      </div>

      <div class="option">
        <input type="checkbox" id="css" name="skills" value="css" />
        <label for="css">CSS</label>
      </div>

      <div class="option">
        <input
          type="checkbox"
          id="javascript"
          name="skills"
          value="javascript"
        />
        <label for="javascript">JavaScript</label>
      </div>
      
      <label for="address">Address</label>
      <textarea name="address" id="address" rows="5" cols="30"> </textarea>
      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
    </form>
    <footer>
      <p>&copy; 2026 Student Information Portal</p>
      <p>All Rights Reserved</p>
    </footer>
  </body>
</html>
